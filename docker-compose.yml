services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://apape:apape_dev@db:5432/apape
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: apape
      POSTGRES_PASSWORD: apape_dev
      POSTGRES_DB: apape
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
